spring:
  datasource:
    url: jdbc:h2:mem:apexcare_billing_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    enabled: false

apexcare:
  jwt:
    secret: test-secret-key-must-be-at-least-thirty-two-chars
    expiration-ms: 3600000
