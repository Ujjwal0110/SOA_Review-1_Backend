spring:
  datasource:
    url: jdbc:h2:mem:apexcare_appointment_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  cloud:
    compatibility-verifier:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: false
eureka:
  client:
    enabled: false
apexcare:
  jwt:
    secret: test-secret-key-must-be-at-least-thirty-two-chars
  billing:
    default-consultation-fee: 1500.00
